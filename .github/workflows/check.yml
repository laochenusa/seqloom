name: Windows validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/contract.test.mjs
      - run: npm run build:requirements
      - run: git diff --exit-code -- docs
  package-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install imageio-ffmpeg==0.6.0
      - run: ./scripts/prepare-ci-runtime.ps1
      - run: node scripts/fixtures.mjs precision-15s
      - run: npm test
  portable-core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install imageio-ffmpeg==0.6.0
      - run: ./scripts/prepare-ci-runtime.ps1
      - run: node scripts/setup-browser.mjs
      - run: node scripts/fixtures.mjs precision-15s
      - run: npm run build:composition
      - run: npm run package:win
      - run: node scripts/check-portable.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-core-evidence
          path: qa/portable-check.json
          if-no-files-found: ignore
          retention-days: 14
